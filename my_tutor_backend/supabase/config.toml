# Supabase CLI config (used by `supabase start` for local development and `supabase db push`).
project_id = "dars"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true

[functions.payment-webhook]
verify_jwt = false

# Guests on the browser call page have no account, so turn-credentials checks tokens itself (Stage 3 B2).
[functions.turn-credentials]
verify_jwt = false

# The database webhooks prove themselves with the x-dars-hook header, not a user token (Round D).
[functions.push-notifications]
verify_jwt = false
