name: my_tutor_app
description: "Dars | درس — connects students and tutors (mobile + web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  # Backend (pure-Dart Supabase client — no extra native setup needed)
  supabase: ^2.6.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  # In-app voice / video calls (Android + web)
  flutter_webrtc: 0.12.12+hotfix.1
  # Chat photos / videos, profile photo, tutor intro video
  image_picker: ^1.1.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
