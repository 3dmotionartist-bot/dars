# Builds the Android APK + Flutter web app + Next.js website on every push,
# attaches the APK to a GitHub Release, and publishes both web builds to GitHub Pages.
name: Build Dars (APK + web app + website)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dars-build
  cancel-in-progress: true

jobs:
  app:
    name: Flutter app (APK + web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my_tutor_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate Android & web platform folders
        run: |
          flutter create --org com.dars --project-name my_tutor_app --platforms=android,web .
          sed -i 's/android:label="my_tutor_app"/android:label="Dars"/' android/app/src/main/AndroidManifest.xml
          # Release builds need this to reach the backend
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Calls open in the browser: let the app find one
          grep -q 'android:scheme="https"' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>#' android/app/src/main/AndroidManifest.xml
          # Ringing phone for incoming calls + message notifications (android_src/MainActivity.kt)
          cp android_src/MainActivity.kt android_src/ScreenShareService.kt android/app/src/main/kotlin/com/dars/my_tutor_app/
          for p in POST_NOTIFICATIONS USE_FULL_SCREEN_INTENT VIBRATE FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PROJECTION; do
            grep -q "android.permission.$p" android/app/src/main/AndroidManifest.xml || \
              sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\"/>\n    <application#" android/app/src/main/AndroidManifest.xml
          done
          # In-app voice / video calls (flutter_webrtc): camera + microphone, Android 6+, keep WebRTC classes in release
          for p in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS ACCESS_NETWORK_STATE CHANGE_NETWORK_STATE; do
            grep -q "android.permission.$p\"" android/app/src/main/AndroidManifest.xml || \
              sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\"/>\n    <application#" android/app/src/main/AndroidManifest.xml
          done
          grep -q 'android.hardware.camera' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
          grep -n "minSdk" android/app/build.gradle* || true
          # Screen sharing service + meeting links (dars://join?room=...) open the app
          grep -q 'ScreenShareService' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#</application>#    <service android:name=".ScreenShareService" android:exported="false" android:foregroundServiceType="mediaProjection"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="dars"' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#</activity>#    <intent-filter>\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="dars" android:host="join"/>\n            </intent-filter>\n        </activity>#' android/app/src/main/AndroidManifest.xml
          # Shared meeting links (https://3dmotionartist-bot.github.io/dars/call/?room=...) open the app directly.
          # Android checks https://3dmotionartist-bot.github.io/.well-known/assetlinks.json against the signing key.
          grep -q 'android:autoVerify' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#</activity>#    <intent-filter android:autoVerify="true">\n                <action android:name="android.intent.action.VIEW"/>\n                <category android:name="android.intent.category.DEFAULT"/>\n                <category android:name="android.intent.category.BROWSABLE"/>\n                <data android:scheme="https" android:host="3dmotionartist-bot.github.io" android:pathPrefix="/dars/call"/>\n            </intent-filter>\n        </activity>#' android/app/src/main/AndroidManifest.xml
          printf -- '-keep class org.webrtc.** { *; }\n-dontwarn org.webrtc.**\n-keep class com.cloudwebrtc.webrtc.** { *; }\n' > android/app/proguard-rules.pro
          cat android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      # Stop here if the code has errors or warnings, or a test fails (nothing is published then).
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      # Same signing key on every build, so updates install over the old app and Android can verify meeting links.
      # The key is a private repository secret: Settings → Secrets and variables → Actions → DARS_KEYSTORE_B64
      # (base64 of the keystore; store password "android", alias "androiddebugkey").
      - name: Use the Dars signing key
        env:
          KS: ${{ secrets.DARS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::DARS_KEYSTORE_B64 is not set: this APK uses a temporary key, so meeting links open in the browser and updates need a reinstall."
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/dars.keystore"
          for d in "$HOME/.android" "${ANDROID_USER_HOME:-}" "${ANDROID_SDK_HOME:+$ANDROID_SDK_HOME/.android}"; do
            [ -n "$d" ] && mkdir -p "$d" && cp "$RUNNER_TEMP/dars.keystore" "$d/debug.keystore"
          done
          echo "DARS_SIGNED=1" >> "$GITHUB_ENV"

      # Backend connection: set repository variables SUPABASE_URL and SUPABASE_ANON_KEY
      # (GitHub → Settings → Secrets and variables → Actions → Variables). Empty = demo mode.
      # Android files (Stage 3 A5): Dars-arm64.apk (most phones), Dars-arm32.apk (older 32-bit phones)
      # and Dars.apk (all phones, larger). Split files get version code 1000×(1 arm32 / 2 arm64) + build number;
      # Dars.apk keeps the plain build number, so every older app can install over itself with any of them.
      - name: Build APKs (arm64, arm32 and one for all phones)
        run: |
          DEFS="--build-number=${{ github.run_number }} --dart-define=DARS_BUILD=${{ github.run_number }} --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}"
          mkdir -p ../apks
          flutter build apk --release $DEFS
          cp build/app/outputs/flutter-apk/app-release.apk ../apks/Dars.apk
          flutter build apk --release --split-per-abi $DEFS
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../apks/Dars-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../apks/Dars-arm32.apk

      # Sign every APK with the Dars key itself (Gradle may pick its own debug key).
      - name: Sign the APKs with the Dars key (must match assetlinks.json)
        if: env.DARS_SIGNED == '1'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in ../apks/*.apk; do
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/dars.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey "$APK"
            "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | tee "$RUNNER_TEMP/certs.txt"
            if ! grep -qi "e2266f71a024f6e1ea89f594acb9ea5796ac0ead10b60e3e74405ea212560a52" "$RUNNER_TEMP/certs.txt"; then
              echo "::error::$APK is not signed with the Dars key (see the fingerprint above). Paste the contents of DARS_KEYSTORE_B64.txt into the secret again."
              exit 1
            fi
          done

      - name: APK sizes
        run: |
          echo "### Android files" >> "$GITHUB_STEP_SUMMARY"
          for f in ../apks/*.apk; do echo "- $(basename "$f"): $(du -k "$f" | cut -f1) KB" | tee -a "$GITHUB_STEP_SUMMARY"; done

      - name: Build web app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/app/" --build-number=${{ github.run_number }} --dart-define=DARS_BUILD=${{ github.run_number }} --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Dars-apk
          path: apks/Dars.apk

      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: my_tutor_app/build/web

      # Links: https://github.com/<user>/<repo>/releases/latest/download/Dars-arm64.apk (also -arm32 and Dars.apk)
      - name: Publish the APKs as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dars test build ${{ github.run_number }}
          body: Install Dars-arm64.apk on Android (most phones; allow "install unknown apps"). Older 32-bit phones use Dars-arm32.apk; Dars.apk works on all phones but is larger. Website and web app are on GitHub Pages.
          files: |
            apks/Dars-arm64.apk
            apks/Dars-arm32.apk
            apks/Dars.apk
          prerelease: false
          make_latest: true

  site:
    name: Next.js website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my_tutor_website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_APP_URL: /${{ github.event.repository.name }}/app/
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: my_tutor_website/out

  pages:
    name: Publish to GitHub Pages
    needs: [app, site]
    # Website: /  ·  Web app: /app/  ·  Dashboard: /admin/  ·  Android APK: /Dars.apk
    # (Free GitHub Pages needs a public repo; on a private repo this job is skipped.)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: _site
      - uses: actions/download-artifact@v4
        with:
          name: web-app
          path: _site/app
      # Old app download address https://<user>.github.io/<repo>/Dars.apk: app builds up to 25 still open it
      # from the "please update" screen. Keep it until min_app_build is 26 or more, then remove these 4 lines.
      - uses: actions/download-artifact@v4
        with:
          name: Dars-apk
          path: _site
      # Admin dashboard: https://<user>.github.io/<repo>/admin/ — call page: /call/
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: |
            my_tutor_admin
            my_tutor_call
      - run: cp -r src/my_tutor_admin _site/admin && cp -r src/my_tutor_call _site/call && rm -rf src
      - run: touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
