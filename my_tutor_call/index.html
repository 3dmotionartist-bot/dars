<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1220">
<title>درس — مكالمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1220; --panel:#151f33; --ink:#fff; --muted:#9fb0c8; --primary:#0e8f7e; --danger:#e5484d; --accent:#f5a524; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Cairo, system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; display: none; }
  #local { position: absolute; width: 112px; height: 160px; top: calc(16px + env(safe-area-inset-top)); inset-inline-end: 16px;
           object-fit: cover; border-radius: 16px; border: 2px solid rgba(255,255,255,.25); background: #222; transform: scaleX(-1); display: none; z-index: 3; }
  #local.back { transform: none; }
  .who { text-align: center; z-index: 2; padding: 24px; }
  .avatar { width: 112px; height: 112px; border-radius: 36px; margin: 0 auto 18px; display: grid; place-items: center;
            font-size: 46px; font-weight: 800; background: linear-gradient(135deg, #13b39e, var(--primary)); box-shadow: 0 0 0 0 rgba(14,143,126,.5); }
  .ringing .avatar { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(14,143,126,.55); } 100% { box-shadow: 0 0 0 34px rgba(14,143,126,0); } }
  h1 { margin: 0 0 6px; font-size: 26px; }
  #status { color: var(--muted); font-size: 16px; min-height: 24px; }
  #timer { font-variant-numeric: tabular-nums; }
  .video-on .who { position: absolute; top: calc(18px + env(safe-area-inset-top)); inset-inline-start: 18px; text-align: start; padding: 0; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  .video-on .who .avatar { display: none; }
  .video-on h1 { font-size: 18px; }
  .video-on #status { font-size: 13px; color: #e6edf7; }
  #controls { position: fixed; bottom: calc(26px + env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; justify-content: center; gap: 16px; z-index: 4; }
  .btn { width: 62px; height: 62px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center;
         cursor: pointer; backdrop-filter: blur(8px); -webkit-tap-highlight-color: transparent; }
  .btn svg { width: 28px; height: 28px; }
  .btn.off { background: #fff; color: var(--bg); }
  .btn.end { background: var(--danger); }
  .btn[hidden] { display: none; }
  #join { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; padding: 24px; text-align: center; }
  #join .card { max-width: 360px; width: 100%; }
  #join p { color: var(--muted); margin: 8px 0 26px; line-height: 1.7; }
  .primary { width: 100%; height: 56px; border: 0; border-radius: 18px; background: var(--primary); color: #fff; font: 800 18px Cairo, sans-serif; cursor: pointer; }
  .ghost { margin-top: 12px; background: none; border: 0; color: var(--muted); font: 700 15px Cairo, sans-serif; cursor: pointer; }
  .note { position: fixed; bottom: calc(110px + env(safe-area-inset-bottom)); left: 16px; right: 16px; text-align: center; color: var(--muted); font-size: 13px; z-index: 4; }
</style>
</head>
<body>
<div id="join">
  <div class="card">
    <div class="avatar" id="joinAvatar">د</div>
    <h1 id="joinTitle"></h1>
    <p id="joinBody"></p>
    <button class="primary" id="joinBtn"></button>
    <button class="ghost" id="joinCancel"></button>
  </div>
</div>

<div id="stage" class="ringing">
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div class="who">
    <div class="avatar" id="avatar">د</div>
    <h1 id="name"></h1>
    <div id="status"></div>
  </div>
</div>
<div class="note" id="note" hidden></div>

<div id="controls">
  <button class="btn" id="mic" aria-label="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
  <button class="btn" id="cam" aria-label="camera" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg></button>
  <button class="btn" id="flip" aria-label="switch camera" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9a8 8 0 0114-3l2 2M20 15a8 8 0 01-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></button>
  <button class="btn" id="share" aria-label="share link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg></button>
  <button class="btn end" id="end" aria-label="end"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-3.2 0-6.2 1-8.6 2.8-.6.4-.7 1.2-.3 1.8l1.6 2.2c.4.5 1.1.7 1.7.4l2.2-1.1c.5-.2.8-.8.7-1.3l-.3-1.7c1.9-.6 4.1-.6 6 0l-.3 1.7c-.1.5.2 1.1.7 1.3l2.2 1.1c.6.3 1.3.1 1.7-.4l1.6-2.2c.4-.6.3-1.4-.3-1.8C18.2 10 15.2 9 12 9z"/></svg></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  "use strict";
  // ---- configuration ---------------------------------------------------------------
  const SUPABASE_URL = "https://upfaylwpfnqplmqqngoj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_e4P1x5mV9AWkdWJGJKfvXg_W5_6ex2h";
  // Public STUN servers find a direct route between the two phones. On strict mobile networks a TURN relay
  // is also needed — add yours here, e.g. { urls: "turn:...", username: "...", credential: "..." }.
  const ICE_SERVERS = [
    { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302", "stun:stun.cloudflare.com:3478"] },
  ];
  const RING_SECONDS = 60;

  // ---- parameters ------------------------------------------------------------------
  const q = new URLSearchParams(location.search);
  const room = (q.get("room") || "").replace(/[^a-zA-Z0-9-]/g, "").slice(0, 64);
  const wantVideo = q.get("video") === "1";
  const lang = q.get("lang") === "en" ? "en" : "ar";
  const peerName = (q.get("peer") || "").slice(0, 60);
  const myName = (q.get("name") || "").slice(0, 60);
  const T = {
    ar: { voice: "مكالمة صوتية", video: "مكالمة فيديو", join: "انضم للمكالمة", cancel: "إلغاء", joinBody: "سنطلب إذن الميكروفون", joinBodyV: "سنطلب إذن الكاميرا والميكروفون",
          waiting: "بانتظار انضمام الطرف الآخر…", connecting: "جارٍ الاتصال…", connected: "متصل", ended: "انتهت المكالمة", left: "غادر الطرف الآخر — بانتظار عودته…",
          noAnswer: "لا يوجد رد. يمكنك إغلاق الصفحة والمحاولة لاحقاً.", denied: "لم يُسمح بالميكروفون/الكاميرا. اسمح بها من إعدادات المتصفح ثم أعد المحاولة.",
          bad: "رابط المكالمة غير صالح.", failed: "تعذّر الاتصال المباشر على هذه الشبكة. جرّب شبكة أخرى (واي فاي/بيانات).", close: "يمكنك إغلاق هذه الصفحة والعودة للتطبيق.",
          offline: "تعذّر الوصول لخادم المكالمات. تحقّق من الإنترنت.", full: "المكالمة ممتلئة (شخصان فقط).", copied: "تم نسخ رابط المكالمة — أرسله لمن تريد", shareTitle: "انضم لمكالمتي على درس" },
    en: { voice: "Voice call", video: "Video call", join: "Join call", cancel: "Cancel", joinBody: "We'll ask for your microphone", joinBodyV: "We'll ask for your camera and microphone",
          waiting: "Waiting for the other person to join…", connecting: "Connecting…", connected: "Connected", ended: "Call ended", left: "The other person left — waiting for them…",
          noAnswer: "No answer. You can close this page and try again later.", denied: "Microphone/camera access was blocked. Allow it in the browser settings and try again.",
          bad: "This call link is not valid.", failed: "Couldn't connect directly on this network. Try another network (Wi-Fi / mobile data).", close: "You can close this page and go back to the app.",
          offline: "Couldn't reach the call server. Check your internet connection.", full: "This call is full (two people only).", copied: "Call link copied — send it to the other person", shareTitle: "Join my Dars call" },
  }[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  const $ = (id) => document.getElementById(id);
  const initial = (s) => (String(s || "").replace(/^(م\.|أ\.|د\.)\s*/, "").trim().charAt(0) || "د");
  const kind = wantVideo ? T.video : T.voice;
  document.title = (lang === "ar" ? "درس — " : "Dars — ") + kind;
  $("name").textContent = peerName || kind;
  $("avatar").textContent = $("joinAvatar").textContent = initial(peerName);
  $("joinTitle").textContent = peerName ? kind + " · " + peerName : kind;
  $("joinBody").textContent = wantVideo ? T.joinBodyV : T.joinBody;
  $("joinBtn").textContent = T.join; $("joinCancel").textContent = T.cancel;
  const status = (s) => { $("status").textContent = s; };
  const note = (s) => { const n = $("note"); n.hidden = !s; n.textContent = s || ""; };

  if (!/^[a-zA-Z0-9-]{8,64}$/.test(room)) { $("joinBody").textContent = T.bad; $("joinBtn").hidden = true; return; }

  // ---- state -------------------------------------------------------------------------
  const me = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)) ;
  let sb, ch, pc, localStream, peerId = null, makingOffer = false, connected = false, ended = false;
  let pendingIce = [], ringTimer, clock, startedAt, facing = "user";

  function newPeer() {
    if (pc) { try { pc.close(); } catch (e) {} }
    pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    localStream.getTracks().forEach((t) => pc.addTrack(t, localStream));
    pc.onicecandidate = (e) => { if (e.candidate && peerId) send("ice", { to: peerId, candidate: e.candidate.toJSON() }); };
    pc.ontrack = (e) => {
      const r = $("remote"); if (r.srcObject !== e.streams[0]) r.srcObject = e.streams[0];
      if (wantVideo) { r.style.display = "block"; document.body.classList.add("video-on"); }
      r.play().catch(() => {});
    };
    pc.onconnectionstatechange = () => {
      const s = pc.connectionState;
      if (s === "connected") onConnected();
      else if (s === "failed") { status(T.failed); note(T.failed); if (peerId && me < peerId) pc.restartIce && pc.restartIce(); }
      else if (s === "disconnected" && connected) status(T.connecting);
    };
    pendingIce = [];
  }

  function onConnected() {
    if (connected) { status(T.connected); return; }
    connected = true; clearTimeout(ringTimer); note(""); $("stage").classList.remove("ringing");
    $("stage").classList.remove("ringing");
    startedAt = Date.now();
    clock = setInterval(() => {
      const s = Math.floor((Date.now() - startedAt) / 1000);
      status(T.connected + " · " + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"));
    }, 1000);
  }

  const plain = (d) => ({ type: d.type, sdp: d.sdp });
  function send(event, payload) { return ch && ch.send({ type: "broadcast", event, payload: { from: me, ...payload } }); }

  async function makeOffer() {
    try {
      makingOffer = true;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      send("offer", { to: peerId, sdp: plain(pc.localDescription) });
    } finally { makingOffer = false; }
  }

  async function flushIce() { for (const c of pendingIce.splice(0)) { try { await pc.addIceCandidate(c); } catch (e) {} } }

  async function start() {
    $("join").remove();
    status(T.connecting);
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: wantVideo ? { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } : false,
      });
    } catch (e) { status(T.denied); note(T.denied); return; }
    if (wantVideo) { const l = $("local"); l.srcObject = localStream; l.style.display = "block"; $("cam").hidden = false; $("flip").hidden = false; }
    newPeer();

    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
    ch = sb.channel("dars-call-" + room, { config: { broadcast: { self: false, ack: false } } });
    const joinedAt = Date.now();
    let peerSeen = 0, helloTimer, connectTimer;
    const hello = () => send("hello", { name: myName, video: wantVideo, at: joinedAt });

    // Same protocol as the app: hello / offer / answer / ice / busy / bye.
    ch.on("broadcast", { event: "hello" }, ({ payload: p }) => {
      if (!p || !p.from || p.from === me || ended) return;
      if (peerId && p.from !== peerId) { send("busy", { to: p.from }); return; }   // two people per call
      peerSeen = Date.now();
      if (peerId === p.from) return;
      peerId = p.from;
      clearTimeout(ringTimer);
      hello();
      status(T.connecting);
      clearTimeout(connectTimer);
      connectTimer = setTimeout(() => { if (!connected) { status(T.failed); note(T.failed); } }, 25000);
      if (me < p.from) makeOffer();                    // exactly one side starts
    });
    ch.on("broadcast", { event: "offer" }, async ({ payload: p }) => {
      if (p.to !== me) return;
      if (peerId && peerId !== p.from) newPeer();       // the other person rejoined
      peerId = p.from; peerSeen = Date.now(); clearTimeout(ringTimer);
      const collision = makingOffer || pc.signalingState !== "stable";
      if (collision && me > p.from) return;            // polite/impolite: the smaller id wins
      if (collision) await pc.setLocalDescription({ type: "rollback" }).catch(() => {});
      await pc.setRemoteDescription(p.sdp);
      await flushIce();
      await pc.setLocalDescription(await pc.createAnswer());
      send("answer", { to: p.from, sdp: plain(pc.localDescription) });
    });
    ch.on("broadcast", { event: "answer" }, async ({ payload: p }) => {
      if (p.to !== me || pc.signalingState !== "have-local-offer") return;
      await pc.setRemoteDescription(p.sdp); await flushIce();
    });
    ch.on("broadcast", { event: "ice" }, async ({ payload: p }) => {
      if (p.to !== me) return;
      if (pc.remoteDescription) { try { await pc.addIceCandidate(p.candidate); } catch (e) {} } else pendingIce.push(p.candidate);
    });
    ch.on("broadcast", { event: "busy" }, ({ payload: p }) => { if (p.to === me && !peerId) finish(T.full); });
    const left = () => {
      if (ended) return;
      status(T.left); connected = false; clearInterval(clock); clock = null; peerId = null;
      $("remote").style.display = "none"; document.body.classList.remove("video-on"); newPeer();
    };
    ch.on("broadcast", { event: "bye" }, ({ payload: p }) => { if (p.from === peerId) left(); });
    ch.on("broadcast", { event: "hangup" }, ({ payload: p }) => { if (p.from === peerId) left(); });

    ch.subscribe((s) => {
      if (s === "SUBSCRIBED") {
        status(T.waiting); hello();
        clearInterval(helloTimer);
        helloTimer = setInterval(() => {
          if (ended) return clearInterval(helloTimer);
          if (!connected) hello();
          if (peerId && !connected && Date.now() - peerSeen > 20000) left();
        }, 3000);
      } else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT") { if (!peerId) { status(T.offline); note(T.offline); } }
    });

    ringTimer = setTimeout(() => { if (!peerId && !connected) status(T.noAnswer); }, RING_SECONDS * 1000);
  }

  function finish(msg) {
    if (ended) return; ended = true;
    clearInterval(clock); clearTimeout(ringTimer);
    try { send("bye", {}); } catch (e) {}
    setTimeout(() => { try { ch && sb.removeChannel(ch); } catch (e) {} }, 300);
    try { pc && pc.close(); } catch (e) {}
    if (localStream) localStream.getTracks().forEach((t) => t.stop());
    $("remote").style.display = "none"; $("local").style.display = "none";
    document.body.classList.remove("video-on");
    $("controls").style.display = "none";
    status(msg); note(T.close);
  }

  // ---- controls ----------------------------------------------------------------------
  $("joinBtn").onclick = start;
  $("joinCancel").onclick = () => { $("joinBody").textContent = T.close; $("joinBtn").hidden = true; $("joinCancel").hidden = true; };
  $("end").onclick = () => finish(T.ended);
  const inviteLink = location.origin + location.pathname + "?room=" + encodeURIComponent(room) + "&video=" + (wantVideo ? "1" : "0");
  $("share").onclick = async () => {
    try { if (navigator.share) { await navigator.share({ title: T.shareTitle, url: inviteLink }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(inviteLink); } catch (e) { prompt("", inviteLink); return; }
    note(T.copied); setTimeout(() => { if (connected) note(""); }, 3500);
  };
  $("mic").onclick = () => {
    if (!localStream) return;
    const a = localStream.getAudioTracks()[0]; if (!a) return;
    a.enabled = !a.enabled; $("mic").classList.toggle("off", !a.enabled);
  };
  $("cam").onclick = () => {
    const v = localStream && localStream.getVideoTracks()[0]; if (!v) return;
    v.enabled = !v.enabled; $("cam").classList.toggle("off", !v.enabled); $("local").style.opacity = v.enabled ? 1 : 0.3;
  };
  $("flip").onclick = async () => {
    if (!localStream) return;
    facing = facing === "user" ? "environment" : "user";
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing } });
      const nt = s.getVideoTracks()[0], old = localStream.getVideoTracks()[0];
      const sender = pc.getSenders().find((x) => x.track && x.track.kind === "video");
      if (sender) await sender.replaceTrack(nt);
      localStream.removeTrack(old); old.stop(); localStream.addTrack(nt);
      $("local").srcObject = localStream; $("local").classList.toggle("back", facing !== "user");
    } catch (e) { facing = facing === "user" ? "environment" : "user"; }
  };
  window.addEventListener("pagehide", () => { if (!ended) { try { send("bye", {}); } catch (e) {} } });
})();
</script>
</body>
</html>
